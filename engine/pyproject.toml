[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanctum-forensics"
version = "0.1.2"
description = "Integrated secure data sanitization and forensic file recovery (SIH 26149, NTRO)"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Proprietary" }

# Runtime dependencies. Exact pins; see constraints.txt for the full locked set.
# NOTE: the SIH prompt named "pyewf-python"; that project does not exist on PyPI.
# The libewf Python bindings (module `import pyewf`) ship as `libewf-python`.
dependencies = [
    "pytsk3==20260715",
    "libewf-python==20240506",
    "pyahocorasick==2.3.1",
    "construct==2.10.70",
    "pydantic==2.13.5",
    "cryptography==50.0.1",
    "reportlab==5.0.1",
    "pikepdf==10.12.0",
    "Pillow==12.3.0",
    "olefile==0.47",
    "piexif==1.1.3",
    "mutagen==1.48.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "structlog==26.1.0",
    "typer==0.27.2",
    "PyYAML==6.0.3",
    "blake3==1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    # starlette's TestClient needs it; the API tests drive every endpoint
    # in-process rather than over a real socket.
    "httpx2==2.12.0",
    # Calibration tooling only: testkit/calibrate.py draws the bucket chart.
    # core/ never imports it, and the harness degrades to CSV-only without it.
    "matplotlib==3.11.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260815",
]

# Desktop packaging only. `desktop` gives the app its native window (WebView2 on
# Windows, WKWebView on macOS, Qt WebEngine on Linux); the launcher has no
# browser fallback and exits if it is missing. Linux takes the `qt` extra
# because pywebview has no built-in Linux backend, and PyQt6 ships wheels where
# PyGObject needs system headers to build. `build` is the freezer the
# scripts/build-* scripts run.
desktop = [
    "pywebview==6.2.1; sys_platform != 'linux'",
    "pywebview[qt]==6.2.1; sys_platform == 'linux'",
]
build = [
    "pyinstaller==6.22.3",
]

[project.scripts]
sanctum = "core.report.cli:main"
sanctum-desktop = "api.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "helper", "api", "testkit"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["core", "helper", "api", "testkit", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008 forbids a function call in an argument default, which is exactly how
# FastAPI's Depends() is spelled. The rule is right about mutable defaults and
# wrong about this framework, so it is disabled for the router modules only -
# core/ and helper/ still get it.
[tool.ruff.lint.per-file-ignores]
"api/routes/*.py" = ["B008"]
"api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
# The deployment target is Linux and core/erase/drive.py uses Linux-only APIs
# (fcntl, O_DIRECT, BLKGETSIZE64). Analyse as Linux regardless of the host the
# type check runs on, so a Windows development box reports the same result CI does.
platform = "linux"
# core/erase/_platform/win.py is ctypes over Win32 and is only ever imported
# when sys.platform == "win32". Under platform = "linux" mypy resolves
# os.O_BINARY and ctypes.WinDLL to nothing and reports errors for code that can
# never run here. It is checked in a second pass under --platform win32 - see
# the `typecheck` target in the Makefile - which is the only thing that checks
# the Windows branch at all, since this pass would otherwise treat it as
# unreachable and skip it entirely.
exclude = ["core/erase/_platform/win\\.py$"]
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "pytsk3",
    "pyewf",
    "ahocorasick",
    "construct",
    "blake3",
    "reportlab.*",
    "pikepdf",
    "olefile",
    "piexif",
    "mutagen",
    "mutagen.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# pytest keeps the temporary directories of the last three runs by default, and
# a full run leaves about 2.6 GiB of loop-volume and corpus images in /tmp. Two
# retained runs plus a live one exceed a 6 GiB per-user tmpfs quota, which is
# what stopped the standards batch. Keep only what a failed test left.
tmp_path_retention_policy = "failed"
